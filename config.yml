model_list:

  # ============================================================
  # FABLE → OpenAI GPT-5.6 Luna (fastest OpenAI tier via Bedrock CRIS, 272K ctx)
  # via global cross-region inference profile — routes from any source
  # region (including ap-south-1) to US capacity; AWS keys only, no OpenAI key.
  # ============================================================
  - model_name: fable
    litellm_params:
      model: bedrock/global.openai.gpt-5.6-luna
      aws_region_name: os.environ/AWS_REGION_OPENCODE
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID_OPENCODE
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY_OPENCODE
      additional_drop_params: ["stop"]

  # ============================================================
  # OPUS → MiniMax M2.5 (complex reasoning tier)
  # ============================================================
  - model_name: opus
    litellm_params:
      model: bedrock/minimax.minimax-m2.5
      temperature: 0.3
      aws_region_name: os.environ/AWS_REGION_OPENCODE
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID_OPENCODE
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY_OPENCODE
      additional_drop_params: ["stop"]

  # ============================================================
  # SONNET → DeepSeek V3.2 (daily coding driver)
  # ============================================================
  - model_name: sonnet
    litellm_params:
      model: bedrock/deepseek.v3.2
      temperature: 0.3
      aws_region_name: os.environ/AWS_REGION_OPENCODE
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID_OPENCODE
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY_OPENCODE
      additional_drop_params: ["stop"]

  # ============================================================
  # HAIKU → Qwen3-Coder-480B (largest context, best for heavy/long tasks)
  # ============================================================
  - model_name: haiku
    litellm_params:
      model: bedrock/qwen.qwen3-coder-480b-a35b-v1:0
      temperature: 0.3
      aws_region_name: os.environ/AWS_REGION_OPENCODE
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID_OPENCODE
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY_OPENCODE
      additional_drop_params: ["stop"]

litellm_settings:
  drop_params: true
  modify_params: true
  request_timeout: 600
  num_retries: 2